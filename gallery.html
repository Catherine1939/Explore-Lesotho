            <img src="lakes lesotho.jpg" class="gallery-img" alt="Lake">
            <img src="snow.webp" class="gallery-img" alt="Snow">
        </div>

        <img id="previewImg" src="" class="hidden" alt="Preview" style="width:100%; margin-top:15px; border-radius:8px;">
